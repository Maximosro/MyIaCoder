<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer crystal gradient -->
    <linearGradient id="crystalGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8956a" />
      <stop offset="45%" stop-color="#d4784a" />
      <stop offset="100%" stop-color="#6b3a22" />
    </linearGradient>
    <!-- Pipe wall gradient (metallic copper) -->
    <linearGradient id="pipeGrad" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0c4a0" />
      <stop offset="30%" stop-color="#d4784a" />
      <stop offset="60%" stop-color="#8b5a3c" />
      <stop offset="100%" stop-color="#4a2a1a" />
    </linearGradient>
    <!-- Pipe interior shadow -->
    <radialGradient id="pipeInside" cx="32" cy="30" r="11" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="70%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#1a0a04" />
    </radialGradient>
  </defs>

  <!-- Outer crystalline hexagon (oxide crystal) -->
  <polygon
    points="32,3 55,16 55,44 32,57 9,44 9,16"
    fill="url(#crystalGrad)"
    opacity="0.9"
    stroke="#d4784a"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Crystal facet lines -->
  <line x1="32" y1="3"  x2="32" y2="57" stroke="#1a0a04" stroke-width="0.7" opacity="0.25" />
  <line x1="9"  y1="30" x2="55" y2="30" stroke="#1a0a04" stroke-width="0.7" opacity="0.25" />
  <line x1="16" y1="9"  x2="48" y2="51" stroke="#1a0a04" stroke-width="0.5" opacity="0.12" />
  <line x1="48" y1="9"  x2="16" y2="51" stroke="#1a0a04" stroke-width="0.5" opacity="0.12" />

  <!-- ══ PIPE ═══════════════════════════════════════════════ -->

  <!-- Pipe flange (hexagonal ring around the pipe) -->
  <polygon
    points="32,14 42,19 42,41 32,46 22,41 22,19"
    fill="none"
    stroke="#d4784a"
    stroke-width="2.5"
    stroke-linejoin="round"
    opacity="0.7"
  />

  <!-- Flange rivets (6 bolts) -->
  <circle cx="32" cy="14" r="1.3" fill="#f0ece8" opacity="0.8" />
  <circle cx="42" cy="19" r="1.3" fill="#f0ece8" opacity="0.8" />
  <circle cx="42" cy="41" r="1.3" fill="#f0ece8" opacity="0.8" />
  <circle cx="32" cy="46" r="1.3" fill="#f0ece8" opacity="0.8" />
  <circle cx="22" cy="41" r="1.3" fill="#f0ece8" opacity="0.8" />
  <circle cx="22" cy="19" r="1.3" fill="#f0ece8" opacity="0.8" />

  <!-- Pipe exterior wall (thick metallic ring) -->
  <circle cx="32" cy="30" r="15" fill="none" stroke="url(#pipeGrad)" stroke-width="7" opacity="0.9" />
  <circle cx="32" cy="30" r="15" fill="none" stroke="#d4784a" stroke-width="7.5" opacity="0.15" />

  <!-- Pipe interior (the dark hole) -->
  <circle cx="32" cy="30" r="11" fill="url(#pipeInside)" />

  <!-- Inner pipe wall highlight (light reflection on metal edge) -->
  <circle cx="32" cy="30" r="11.5" fill="none" stroke="#f0ece8" stroke-width="0.8" opacity="0.35" />
  <circle cx="32" cy="30" r="18.5" fill="none" stroke="#f0ece8" stroke-width="0.6" opacity="0.2" />

  <!-- Subtle rust drip from pipe -->
  <path
    d="M44 37 Q45 43 43 46"
    fill="none"
    stroke="#d4784a"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.5"
  />
  <circle cx="43" cy="47" r="1" fill="#d4784a" opacity="0.5" />
</svg>
